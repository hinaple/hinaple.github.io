<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>크레딧 생성기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wipeautcrafter/jscolorpicker@main/dist/colorpicker.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header class="page-header">
      <h1>크레딧 생성기</h1>
      <p>스크롤 크레딧 MP4 생성기</p>
    </header>

    <section class="panel fixed-text-panel">
      <h2>크레딧 문구</h2>
      <textarea id="text" rows="10"><b>SAMPLE</b>
테스트 크레딧
테스트 크레딧
테스트 크레딧
테스트 크레딧


<b>테스트</b>
sample credit
sample credit
sample credit
sample credit</textarea>
      <p class="muted">글꼴 그룹: <code>&lt;id&gt;텍스트&lt;/id&gt;</code> · 가로 공간: <code>{#width=300}</code> · 세로 공간: <code>{#height=20}</code> · 중앙 기준점: <code>[#a]텍스트[/a]</code></p>
    </section>

    <section class="settings-tabs">
      <div class="tab-list" role="tablist" aria-label="크레딧 설정">
        <button type="button" role="tab" id="tab-typography" aria-controls="panel-typography" aria-selected="true" data-tab="typography">글꼴</button>
        <button type="button" role="tab" id="tab-snippets" aria-controls="panel-snippets" aria-selected="false" tabindex="-1" data-tab="snippets">스니펫</button>
        <button type="button" role="tab" id="tab-canvas" aria-controls="panel-canvas" aria-selected="false" tabindex="-1" data-tab="canvas">화면</button>
        <button type="button" role="tab" id="tab-timing" aria-controls="panel-timing" aria-selected="false" tabindex="-1" data-tab="timing">시간</button>
        <button type="button" role="tab" id="tab-audio" aria-controls="panel-audio" aria-selected="false" tabindex="-1" data-tab="audio">음성</button>
      </div>

      <div class="tab-panels panel">
        <div class="tab-panel" id="panel-typography" role="tabpanel" aria-labelledby="tab-typography" data-panel="typography">
          <div class="typography-options">
            <label class="inline"><input id="wrap" type="checkbox" checked> 자동 줄바꿈</label>
            <label>정렬
              <select id="textAlign">
                <option value="left">왼쪽</option>
                <option value="center" selected>가운데</option>
                <option value="right">오른쪽</option>
              </select>
            </label>
          </div>
          <div id="fontGroups" class="font-groups"></div>
          <button id="addFontGroup" type="button">+ 글꼴 그룹 추가</button>
        </div>

        <div class="tab-panel" id="panel-snippets" role="tabpanel" aria-labelledby="tab-snippets" data-panel="snippets" hidden>
          <p class="muted snippet-description">위에서 아래 순서로 검색 문자열을 모두 치환한 뒤 크레딧 문법을 처리합니다.</p>
          <div id="snippets" class="snippet-list"></div>
          <button id="addSnippet" type="button">+ 스니펫 추가</button>
        </div>

        <div class="tab-panel" id="panel-canvas" role="tabpanel" aria-labelledby="tab-canvas" data-panel="canvas" hidden>
          <div class="canvas-row canvas-row-primary">
            <label>너비 <input id="width" type="number" min="2" step="1" value="1920"></label>
            <label>높이 <input id="height" type="number" min="2" step="1" value="1080"></label>
            <label>가로 여백 (px) <input id="padding" type="number" min="0" step="1" value="80"></label>
          </div>
          <div class="canvas-row canvas-row-secondary">
            <label>프레임레이트 <input id="fps" type="number" min="1" max="120" step="1" value="30"></label>
            <label>배경색 <input id="backgroundColor" type="text" value="#000000"></label>
          </div>
        </div>

        <div class="tab-panel" id="panel-timing" role="tabpanel" aria-labelledby="tab-timing" data-panel="timing" hidden>
          <div class="grid">
            <label>크레딧 길이 (초) <input id="duration" type="number" min="0.001" step="0.1" value="30"></label>
            <label>시작 공백 (초) <input id="blankStart" type="number" min="0" step="0.1" value="0"></label>
            <label>끝 공백 (초) <input id="blankEnd" type="number" min="0" step="0.1" value="0"></label>
          </div>
        </div>

        <div class="tab-panel" id="panel-audio" role="tabpanel" aria-labelledby="tab-audio" data-panel="audio" hidden>
          <div class="audio-grid">
            <label class="file-field">음성 파일 <input id="audioFile" type="file" accept="audio/*"></label>
            <label>결과 길이 기준
              <select id="durationMode">
                <option value="credit" selected>크레딧 길이</option>
                <option value="audio">음성 파일 길이</option>
              </select>
            </label>
            <label>볼륨 <input id="volume" type="number" min="0" max="2" step="0.05" value="1"></label>
            <label>음성 시작 (초) <input id="audioStart" type="number" min="0" step="0.1" value="0"></label>
          </div>
          <p id="audioInfo" class="muted">음성 파일 없음</p>
        </div>
      </div>
    </section>

    <section class="output-panel">
      <div class="section-heading">
        <div><h2>미리보기</h2><p id="info"></p></div>
        <div class="preview-controls">
          <button id="playPause" type="button" aria-pressed="false">재생</button>
          <button id="restart" type="button">처음부터</button>
        </div>
      </div>
      <p id="error" role="alert"></p>
      <canvas id="preview"></canvas>
      <div class="timeline-row">
        <input id="timeline" type="range" min="0" max="30" step="0.001" value="0" aria-label="미리보기 타임라인">
        <span id="timelineTime">0.000 / 30.000초</span>
      </div>
      <div class="export-row">
        <button id="export" type="button" class="primary">MP4 내보내기</button>
        <progress id="progress" max="1" value="0"></progress>
        <span id="status"></span>
      </div>
    </section>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
